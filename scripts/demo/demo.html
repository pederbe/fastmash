<!DOCTYPE html>
<!-- The animated demo: the same command in GNU datamash and Fastmash, racing
     at their measured speeds. scripts/demo/record.mjs renders it frame by
     frame; the timings and output come from a real run (see TIMINGS). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --line: #30363d; --fg: #e6edf3; --muted: #9fb0c3;
  --teal: #2dd4bf; --amber: #fbbf24; --red: #f87171;
  --mono: "DejaVu Sans Mono", monospace;
  --sans: "DejaVu Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 960px; height: 540px; background: var(--bg); overflow: hidden; }
body { font-family: var(--sans); color: var(--fg); padding: 26px 30px; }
.title { display: flex; justify-content: space-between; align-items: baseline; height: 40px; }
.title h1 { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; }
.title h1 span { color: var(--amber); }
.title .data { font: 500 14px/1 var(--mono); color: var(--muted); }
.panes { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 16px; }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; height: 322px; overflow: hidden; }
.pane.fastmash { border-color: var(--amber); }
.bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.bar .name { font: 600 15px/1 var(--sans); }
.pane.fastmash .bar .name { color: var(--teal); }
.clock { font: 500 17px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.clock.done { color: var(--fg); }
.pane.fastmash .clock.done { color: var(--teal); }
pre { font: 500 13.5px/1.8 var(--mono); padding: 14px 16px; white-space: pre-wrap; word-break: break-all; }
.prompt { color: var(--amber); }
.prog { color: var(--fg); font-weight: 700; }
.out { color: var(--teal); }
.dim { color: var(--muted); }
.cursor { display: inline-block; width: 9px; height: 17px; background: var(--teal); vertical-align: -3px; }
.footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; height: 48px; }
.verdict { font-size: 24px; font-weight: 800; letter-spacing: -0.015em; white-space: nowrap; }
.verdict .x { color: var(--amber); }
.cta { white-space: nowrap; font: 500 14px/1 var(--mono); color: var(--fg); border: 1px solid var(--amber); border-radius: 10px; padding: 12px 16px; }
.cta .prompt { margin-right: 8px; }
.hidden { visibility: hidden; }
</style>
</head>
<body>
<div class="title">
  <h1>Same command. Same answer. <span>4× faster.</span></h1>
  <div class="data">2.4 million gene records</div>
</div>
<div class="panes">
  <div class="pane datamash">
    <div class="bar"><span class="name">GNU datamash 1.9</span><span class="clock" id="clock-d">0.00 s</span></div>
    <pre id="term-d"></pre>
  </div>
  <div class="pane fastmash">
    <div class="bar"><span class="name">fastmash</span><span class="clock" id="clock-f">0.00 s</span></div>
    <pre id="term-f"></pre>
  </div>
</div>
<div class="footer">
  <div class="verdict hidden" id="verdict">Identical output, <span class="x">4.1× faster</span></div>
  <div class="cta hidden" id="cta"><span class="prompt">$</span>curl -fsSL https://fastmash.io/install.sh | sh</div>
</div>
<script>
// Measured on the AMD desktop (WSL2), LC_ALL=C, 2,442,210 RefGene records
// (the benchmark file repeated 30 times); median of three runs each.
const TIMINGS = { datamash: 1.905, fastmash: 0.460 };
const OUTPUT = '4\t8\t14\t10';
const ARGS = ' q1 9 median 9 q3 9 iqr 9 < genes.tsv';
const TYPE_START = 1.2, TYPE_SPEED = 26;       // seconds, characters per second
const RUN_START = TYPE_START + ('fastmash' + ARGS).length / TYPE_SPEED + 0.6;

function escape(text) { return text.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

function pane(program, t) {
  const command = program + ARGS;
  const typed = Math.max(0, Math.min(command.length, Math.floor((t - TYPE_START) * TYPE_SPEED)));
  const shown = command.slice(0, typed);
  const name = shown.slice(0, Math.min(shown.length, program.length));
  let text = '<span class="prompt">$</span> <span class="prog">' + escape(name) + '</span>' + escape(shown.slice(name.length));
  const running = t >= RUN_START;
  const finished = running && t >= RUN_START + TIMINGS[program];
  if (!running) text += '<span class="cursor"></span>';
  if (finished) {
    text += '\n<span class="out">' + escape(OUTPUT) + '</span>';
    text += '\n<span class="dim">real ' + TIMINGS[program].toFixed(2) + ' s</span>';
    text += '\n<span class="prompt">$</span> <span class="cursor"></span>';
  }
  const elapsed = running ? Math.min(t - RUN_START, TIMINGS[program]) : 0;
  return { text, clock: elapsed.toFixed(2) + ' s', done: finished };
}

window.render = function (t) {
  for (const [program, id] of [['datamash', 'd'], ['fastmash', 'f']]) {
    const state = pane(program, t);
    document.getElementById('term-' + id).innerHTML = state.text;
    const clock = document.getElementById('clock-' + id);
    clock.textContent = state.clock;
    clock.classList.toggle('done', state.done);
  }
  const end = RUN_START + TIMINGS.datamash;
  document.getElementById('verdict').classList.toggle('hidden', t < end + 0.5);
  document.getElementById('cta').classList.toggle('hidden', t < end + 1.6);
};
window.DURATION = RUN_START + TIMINGS.datamash + 14;
window.render(0);
</script>
</body>
</html>
