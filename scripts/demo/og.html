<!DOCTYPE html>
<!-- The 1200x630 link-preview image (og:image). scripts/demo/record.mjs
     renders it to site/og.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --line: #30363d; --fg: #e6edf3; --muted: #9fb0c3;
  --teal: #2dd4bf; --amber: #fbbf24;
  --mono: "DejaVu Sans Mono", monospace; --sans: "DejaVu Sans", sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; background: var(--bg); overflow: hidden; }
body { font-family: var(--sans); color: var(--fg); padding: 64px 72px; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 16px; font: 700 34px/1 var(--mono); }
.brand img { width: 44px; height: 44px; }
h1 { margin-top: 56px; font-size: 64px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; }
h1 span { color: var(--amber); }
p { margin-top: 24px; font-size: 27px; color: var(--muted); line-height: 1.4; }
.cmd { margin-top: auto; align-self: flex-start; font: 500 24px/1 var(--mono); border: 2px solid var(--amber);
       border-radius: 14px; padding: 18px 24px; background: var(--surface); }
.cmd b { color: var(--amber); font-weight: 500; margin-right: 12px; }
</style>
</head>
<body>
<div class="brand"><img src="../../docs/theme/favicon.svg" alt="">fastmash</div>
<h1>Faster than GNU datamash<span>.</span><br>Same commands.</h1>
<p>Command-line statistics for delimited text. Up to 4× faster,<br>identical results on every machine.</p>
<div class="cmd"><b>$</b>curl -fsSL https://fastmash.io/install.sh | sh</div>
</body>
</html>
