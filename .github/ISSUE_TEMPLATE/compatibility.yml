name: Compatibility difference
description: Fastmash and GNU datamash behave differently for the same command.
labels: ["compatibility", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [Differences from GNU datamash](https://fastmash.io/guide/differences.html) first: some differences are intentional.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: How do Fastmash and GNU datamash differ, and how does that affect your task?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Which behavior do you expect, and why?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Include the same command and input for both programs, their output,
        errors and exit statuses, both versions and relevant locale and operating
        system settings where available. If you cannot make a comparison yet,
        describe what you observed and what remains unknown.
    validations:
      required: true
