name: Feature request
description: Suggest an improvement. For a slow job, use "Slower than GNU datamash".
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is difficult or unsupported, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would Fastmash let you do? Describe the result, without needing to design the solution.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Examples, current workarounds or relevant links, if available.
