name: Feature request
description: Suggest an improvement. For a slow job, use "Slower than GNU datamash".
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and the data, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like Fastmash to help.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you do today instead.
