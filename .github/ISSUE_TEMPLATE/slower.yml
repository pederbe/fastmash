name: Slower than GNU datamash
description: A job where Fastmash is slower than GNU datamash, or slower than you expected.
labels: ["performance", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        The [benchmark kit](https://github.com/pederbe/fastmash/tree/main/bench) can help compare your command with GNU datamash.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which job is slow, and how does that affect your task?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would make this job useful? Give a timing goal if you have one.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Include the command, input or data description, observed timings, versions,
        locale and relevant machine details where available. For a comparison,
        run both programs with the same input and settings. An observation without
        a repeatable benchmark is welcome, and you can say what remains unknown.
    validations:
      required: true
