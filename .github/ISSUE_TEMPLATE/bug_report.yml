name: Bug report
description: Fastmash crashed, hung, gave a wrong result or an unhelpful error.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a difference from GNU datamash, use the **Compatibility difference** form instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and how does it affect your task?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should happen instead? You do not need to propose a fix.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Include the command, minimal input, output or error, exit status,
        `fastmash --version`, and relevant operating system and locale settings
        where available. Describe your observations even if you cannot reproduce
        the problem yet, and say which details are unknown.
    validations:
      required: true
