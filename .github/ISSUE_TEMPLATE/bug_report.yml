name: Bug report
description: Fastmash crashed, hung, gave a wrong result or an unhelpful error.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a difference from GNU datamash, use the **Compatibility difference** form instead.
  - type: textarea
    id: command
    attributes:
      label: Command and input
      description: A minimal command and input that reproduce the problem. Paste text, not a screenshot.
      placeholder: |
        printf '1\t2\n3\t4\n' | fastmash sum 1
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Output, error message and exit status (`echo $?`).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fastmash version
      description: Output of `fastmash --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Distribution, kernel (`uname -r`), WSL or native, and locale (`locale`)
      placeholder: Ubuntu 24.04, 6.8.0, native, LANG=C.UTF-8
    validations:
      required: true
