# Keep routine updates separate from major updates and intentional data and API pins.
# Security updates remain immediate and are classified by the same merge workflow.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/release/publication-test-server"
      - "/tools/icu-exemplars"
    schedule:
      interval: monthly
    groups:
      # Review retained Unicode reference data, production collation data and
      # the unstable CollationKeySink API. Other updates use normal checks.
      # Keep the same exclusions in dependabot-auto-merge.yml for security PRs.
      cargo-pinned:
        patterns:
          - "icu_collator"
          - "icu_collator_data"
          - "icu_properties"
          - "icu_properties_data"
          - "unicode-case-mapping"
      cargo-routine:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      cargo-review:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      npm-routine:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      npm-review:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions-routine:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      actions-review:
        patterns: ["*"]
        update-types: ["major"]
