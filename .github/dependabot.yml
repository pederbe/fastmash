# Keep routine updates separate from major updates and intentional data and API pins.
# Security updates remain immediate and are classified by the same merge workflow.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/release/publication-test-server"
      - "/tools/icu-exemplars"
    schedule:
      interval: monthly
    # This generator must retain Unicode 16 data. Upgrade normalization only
    # with its reference data and fixtures, even for a crate patch release.
    # Ignore version updates by type so security updates remain eligible.
    ignore:
      - dependency-name: "unicode-normalization"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      # These versions retain Unicode reference data, locale behavior and the
      # unstable ICU API or installed ICU reference used by the tooling.
      # Keep the same exclusions in dependabot-auto-merge.yml for security PRs.
      cargo-pinned:
        patterns:
          - "icu_collator*"
          - "icu_locale_core"
          - "icu_properties*"
          - "rust_icu_*"
          - "unicode-case-mapping"
          - "unicode-normalization"
          - "unicode-general-category"
          - "unicode_names2"
      cargo-routine:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      cargo-review:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      npm-routine:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      npm-review:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions-routine:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      actions-review:
        patterns: ["*"]
        update-types: ["major"]
