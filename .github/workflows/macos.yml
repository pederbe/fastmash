name: Native macOS

on:
  workflow_dispatch:
    inputs:
      release-archive:
        description: Build and qualify a release-layout candidate without publishing
        type: boolean
        default: false
  workflow_call:
    inputs:
      release-archive:
        type: boolean
        default: false
    outputs:
      archive-sha256:
        value: ${{ jobs.archive.outputs.sha256 }}
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  attestations: read

concurrency:
  group: macos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !inputs.release-archive }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"

defaults:
  run:
    shell: bash

jobs:
  native-contract:
    name: Complete command contract on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || inputs.release-archive || !github.event.repository.private
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            major: "15"
          - os: macos-26
            major: "26"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Record native source, compiler and fixture identities
        run: |
          export EVIDENCE="$RUNNER_TEMP/native-contract"
          printf 'EVIDENCE=%s\n' "$EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = "${{ matrix.major }}"
          test "$(rustc -Vv | sed -n 's/^host: //p')" = aarch64-apple-darwin
          {
            git rev-parse HEAD
            git status --porcelain
            uname -a
            sw_vers
            rustc -Vv
            cargo -V
            python3 --version
            printf 'target=aarch64-apple-darwin\nMACOSX_DEPLOYMENT_TARGET=%s\nCARGO_INCREMENTAL=%s\n' "$MACOSX_DEPLOYMENT_TARGET" "$CARGO_INCREMENTAL"
            printf 'RUSTFLAGS=%s\nCARGO_ENCODED_RUSTFLAGS=%s\n' "${RUSTFLAGS-}" "${CARGO_ENCODED_RUSTFLAGS-}"
            printf 'profile=release opt-level=2 panic=abort overflow-checks=true lto=false codegen-units=1\n'
          } | tee "$EVIDENCE/identity.txt"
          git ls-files tests/cli crates/portable-numerics/testdata crates/cli/src/testdata |
            while IFS= read -r path; do shasum -a 256 "$path"; done > "$EVIDENCE/fixtures.sha256"
          shasum -a 256 Cargo.toml Cargo.lock crates/*/Cargo.toml > "$EVIDENCE/manifests.sha256"
      - name: Build and identify native fault transports
        run: |
          helpers="$RUNNER_TEMP/native-fault-helpers"
          mkdir -p "$helpers"
          rustc --edition=2024 --crate-type=cdylib -C panic=abort -C opt-level=2 crates/cli/tests/support/full_output_interposer.rs -o "$helpers/full-output.dylib"
          rustc --edition=2024 -C panic=abort -C opt-level=2 crates/cli/tests/support/full_output_probe.rs -o "$helpers/full-output-probe"
          shasum -a 256 "$helpers/full-output.dylib" "$helpers/full-output-probe" | tee "$EVIDENCE/fault-helpers.sha256"
          printf 'FASTMASH_TEST_FULL_OUTPUT_LIBRARY=%s\nFASTMASH_TEST_FULL_OUTPUT_PROBE=%s\n' "$helpers/full-output.dylib" "$helpers/full-output-probe" >> "$GITHUB_ENV"
      - name: Check formatting, native lint and corpus adapters
        run: |
          cargo fmt --all --check 2>&1 | tee "$EVIDENCE/fmt.log"
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$EVIDENCE/clippy.log"
          python3 -B -m unittest discover -s scripts -p 'test_check_regressions.py' 2>&1 | tee "$EVIDENCE/corpus-adapters.log"
      - name: Execute all applicable release workspace tests
        run: |
          cargo test --release --workspace --locked -- --list 2>&1 | tee "$EVIDENCE/test-inventory.txt"
          cargo test --release --workspace --locked --no-fail-fast 2>&1 | tee "$EVIDENCE/workspace-tests.log"
      - name: Execute the frozen corpus through both input modes
        run: |
          cargo build --release --workspace --locked 2>&1 | tee "$EVIDENCE/build.log"
          binary="$GITHUB_WORKSPACE/target/release/fastmash"
          file "$binary" | tee "$EVIDENCE/binary.txt"
          shasum -a 256 "$binary" | tee "$EVIDENCE/binary.sha256"
          "$binary" --version | tee "$EVIDENCE/version.txt"
          "$binary" --help > "$EVIDENCE/help.txt"
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' crates/cli/Cargo.toml | head -n 1)
          python3 -B scripts/check_regressions.py --binary "$binary" --expected-version "$version" --keep-going --evidence-dir "$EVIDENCE/corpus-pipe" 2>&1 | tee "$EVIDENCE/corpus-pipe.log"
          python3 -B scripts/check_regressions.py --binary "$binary" --expected-version "$version" --stdin-file --keep-going --evidence-dir "$EVIDENCE/corpus-file" 2>&1 | tee "$EVIDENCE/corpus-file.log"
      - name: Retain native command evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-contract-${{ matrix.os }}
          path: ${{ runner.temp }}/native-contract/
          if-no-files-found: error

  archive:
    name: Build the macOS 15 archive
    needs: native-contract
    outputs:
      sha256: ${{ steps.archive.outputs.sha256 }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the checksummed archive
        id: archive
        env:
          RELEASE_ARCHIVE: ${{ inputs.release-archive }}
        run: |
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          mkdir -p "$RUNNER_TEMP/macos-archive"
          mode=development
          if [ "$RELEASE_ARCHIVE" = true ]; then mode=release; fi
          bash release/macos-archive.sh "$RUNNER_TEMP/macos-archive" "$mode" 2>&1 | tee "$RUNNER_TEMP/macos-archive/build.log"
          digest=$(shasum -a 256 "$RUNNER_TEMP/macos-archive"/*.tar.gz)
          printf 'sha256=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"
      - name: Retain the archive and build provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-archive
          path: ${{ runner.temp }}/macos-archive/
          if-no-files-found: error

  installed-contract:
    needs: archive
    uses: ./.github/workflows/macos-install.yml
    permissions:
      contents: read
      attestations: read
    with:
      release-archive: ${{ inputs.release-archive || false }}
      archive-sha256: ${{ needs.archive.outputs.sha256 }}
