name: Documentation

# Checks that the website builds and its links resolve. Deployment is not done
# here: Cloudflare Workers Builds runs the same scripts/build_site.sh on every
# push to main and deploys docs/book (wrangler.jsonc). Manual runs also retain
# the checked production assets for deployment if that service is unavailable.
# Automatic checks start once the repository is public.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      browser:
        description: Check website interactions and demo rendering
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Public reference check
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_check_public_references.py'
          python3 -B scripts/check_public_references.py
      - name: Check user documentation for release numbers
        run: cargo test --locked -p fastmash --test documentation
      # The deploy build: pinned mdBook, committed diagram renders (a missing
      # or unused render fails), landing page and install.sh at the root.
      - run: bash scripts/build_site.sh --cloudflare
      - name: Check website and demo rendering
        if: inputs.browser || github.event_name == 'workflow_dispatch'
        env:
          TMPDIR: ${{ runner.temp }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          BROWSER_PATH=$(command -v google-chrome)
          export BROWSER_PATH
          npm run test:landing
          npm run test:docs
          python3 -B scripts/benchmark_chart.py svg docs/src/benchmarks/core-jobs.tsv "$TMPDIR/core-jobs.svg"
          npx wrangler deploy --dry-run --outdir "$TMPDIR/website-dry-run"
          node scripts/demo/record.mjs --preview --og
          git diff --exit-code -- site/
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress --fallback-extensions html --index-files index.html --root-dir ${{ github.workspace }}/docs/book docs/book
      - name: Retain checked website for manual deployment
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-website
          path: docs/book
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
