name: Documentation

# Checks that the website builds and its links resolve. Deployment is not done
# here: Cloudflare Workers Builds runs the same scripts/build_site.sh on every
# push to main and deploys docs/book (wrangler.jsonc).
# This Actions check runs only when started manually.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The deploy build: pinned mdBook, committed diagram renders (a missing
      # or unused render fails), landing page and install.sh at the root.
      - run: bash scripts/build_site.sh
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/docs/book docs/book
