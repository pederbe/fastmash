name: CI

# Automatic checks start once the repository is public.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Classify changes
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      application: ${{ steps.scope.outputs.application }}
      packages: ${{ steps.scope.outputs.packages }}
      configuration: ${{ steps.scope.outputs.configuration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select affected checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          bash .github/scripts/ci-scope.sh "$BASE_SHA" | tee "$GITHUB_OUTPUT"

  # Keep the required job names. Missing filter output runs the checks.
  check:
    name: Format and lint
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.repository.private &&
        (needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != '' || needs.changes.outputs.configuration == 'true')))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check workflow selection
        if: needs.changes.outputs.configuration == 'true'
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/test-ci-scope.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: needs.changes.outputs.configuration == 'true' || needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != ''
        with:
          # Pinned like the release builder, so a new Rust release's lints do
          # not fail unrelated pull requests; raise it deliberately.
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: Check weekly release tooling
        if: needs.changes.outputs.configuration == 'true' || needs.changes.outputs.application != 'false'
        run: |
          bash -n release/prepare-linux.sh release/check-crate-packages.sh release/publish-crates.sh
          cargo fmt --manifest-path release/publication-test-server/Cargo.toml --check
          cargo clippy --locked --manifest-path release/publication-test-server/Cargo.toml --target-dir target --bin fastmash-release -- -D warnings
          cargo test --locked --manifest-path release/publication-test-server/Cargo.toml --target-dir target --bin fastmash-release
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != ''
      - run: cargo fmt --all --check
        if: needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != ''
      - name: Lint affected packages
        if: needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != ''
        env:
          APPLICATION: ${{ needs.changes.outputs.application }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          if [ "$APPLICATION" != false ]; then
            cargo clippy --workspace --all-targets --locked -- -D warnings
          else
            for package in $PACKAGES; do
              cargo clippy -p "$package" --all-targets --locked -- -D warnings
            done
          fi

  test:
    name: Test
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.repository.private &&
        (needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != '')))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Prepare installed verification tools
        if: needs.changes.outputs.application != 'false' || contains(format(' {0} ', needs.changes.outputs.packages), ' fastmash ')
        run: cargo build --locked --manifest-path release/publication-test-server/Cargo.toml --target-dir target --bins
      - name: Test affected packages
        env:
          APPLICATION: ${{ needs.changes.outputs.application }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          if [ "$APPLICATION" != false ]; then
            cargo test --release --workspace --locked
            cargo build --release --workspace --locked
          else
            for package in $PACKAGES; do
              if [ "$package" = fastmash ]; then
                cargo build --release -p fastmash -p fastmash-sort-process --locked
              fi
              cargo test --release -p "$package" --locked
            done
          fi
      # The supervisor must sit beside the binary (built by the workspace build).
      - name: Regression corpus
        if: needs.changes.outputs.application != 'false'
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' crates/cli/Cargo.toml | head -n 1)
          target/release/fastmash-corpus --binary target/release/fastmash --expected-version "$version" --keep-going --evidence-dir "$RUNNER_TEMP/corpus/pipe"
          target/release/fastmash-corpus --binary target/release/fastmash --expected-version "$version" --stdin-file --keep-going --evidence-dir "$RUNNER_TEMP/corpus/file"
      - name: Retain corpus evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-linux
          retention-days: 7
          path: ${{ runner.temp }}/corpus/
          if-no-files-found: ignore

  profiling:
    name: Static profiling on ${{ matrix.os }}
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.repository.private && needs.changes.outputs.application != 'false'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy -p fastmash --all-targets --features hotpath-alloc --locked -- -D warnings
      - run: cargo test --profile profiling -p fastmash --features hotpath-alloc --test profiling --locked
      - run: cargo build --profile profiling -p fastmash --features hotpath-alloc --bin fastmash --example profile-jobs --locked
      - name: Capture static Representative jobs
        shell: bash
        run: target/profiling/examples/profile-jobs "$RUNNER_TEMP/fastmash-profiling"
      - run: cargo check -p fastmash --all-targets --all-features --locked
      - name: Prepare CPU sampling on the disposable Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/samply.tar.xz" https://github.com/mstange/samply/releases/download/samply-v0.13.1/samply-x86_64-unknown-linux-gnu.tar.xz
          printf '61875daad67888798690dea3cb2748279df6ac299c5c6a857d67eed7642473d9  %s\n' "$RUNNER_TEMP/samply.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/samply.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/samply-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
          cargo install hotpath --version 0.29.0 --bin hotpath-samply --no-default-features --locked
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.yama.ptrace_scope=0 kernel.kptr_restrict=0
      - name: Capture attributed CPU samples
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --profile profiling -p fastmash --features hotpath-cpu --bin fastmash --example profile-jobs --locked
          setsid -w target/profiling/examples/profile-jobs "$RUNNER_TEMP/fastmash-cpu" decimal
          jq -e '.functions_cpu.attributed_samples > 0' "$RUNNER_TEMP/fastmash-cpu/decimal.json"
      - name: Capture instruction counts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends valgrind
          cargo build --profile profiling -p fastmash --features hotpath-callgrind --bin fastmash --locked
          capture="$RUNNER_TEMP/fastmash-callgrind"
          mkdir "$capture"
          printf '1\n2\n3\n' > "$capture/input"
          HOTPATH_METRICS_SERVER_OFF=1 HOTPATH_OUTPUT_PATH="$capture/report.json" \
            HOTPATH_CALLGRIND_OUT_FILE="$capture/callgrind.%p" \
            valgrind --tool=callgrind --callgrind-out-file="$capture/callgrind.%p" \
            target/profiling/fastmash sum 1 < "$capture/input" > "$capture/stdout"
          printf '6\n' | cmp - "$capture/stdout"
          jq -e '.functions_icount.tool | startswith("callgrind-")' "$capture/report.json"
          jq -e '.functions_icount.data | any(.total | tonumber > 0)' "$capture/report.json"
          jq -e '.functions_timing == null' "$capture/report.json"
      - name: Retain diagnostic reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profiling-${{ matrix.os }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/fastmash-profiling/*.json
            ${{ runner.temp }}/fastmash-profiling/*.command
            ${{ runner.temp }}/fastmash-profiling/*.status
            ${{ runner.temp }}/fastmash-profiling/identity.txt
            ${{ runner.temp }}/fastmash-cpu/*.json
            ${{ runner.temp }}/fastmash-cpu/*.command
            ${{ runner.temp }}/fastmash-cpu/*.status
            ${{ runner.temp }}/fastmash-callgrind/
            ${{ runner.temp }}/fastmash-cpu/identity.txt
            /tmp/hotpath/**/hp.json.gz

  msrv:
    name: Minimum supported Rust version
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.repository.private &&
        (needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != '')))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88" # rust-version in crates/*/Cargo.toml
      - name: Check affected packages on minimum Rust
        env:
          APPLICATION: ${{ needs.changes.outputs.application }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          if [ "$APPLICATION" != false ]; then
            cargo check --workspace --locked
            cargo check --manifest-path release/publication-test-server/Cargo.toml --target-dir target --all-targets --locked
          else
            for package in $PACKAGES; do
              cargo check -p "$package" --all-targets --locked
            done
          fi

  licenses:
    name: Dependency licenses and advisories
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.repository.private &&
        (needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != '')))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Each published crate carries the licence texts; keep them identical.
      - name: Licence texts in every crate
        run: |
          for crate in cli conversion numeric-contract portable-numerics sort-process; do
            cmp LICENSE-MIT "crates/$crate/LICENSE-MIT"
            cmp LICENSE-APACHE "crates/$crate/LICENSE-APACHE"
          done
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  native:
    name: Native macOS
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.repository.private && needs.changes.outputs.application != 'false')
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: read
      attestations: read
