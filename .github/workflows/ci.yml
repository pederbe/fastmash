name: CI

# Automatic checks start once the repository is public.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format and lint
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Public reference check
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_check_public_references.py'
          python3 -B scripts/check_public_references.py
      - name: Locale generator checks
        run: python3 -B -m unittest discover -s scripts -p 'test_generate_numeric_locales.py'
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          # Pinned like the release builder, so a new Rust release's lints do
          # not fail unrelated pull requests; raise it deliberately.
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --release --workspace --locked
      - run: cargo build --release --locked
      # The supervisor must sit beside the binary (built by the workspace build).
      - name: Regression corpus
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' crates/cli/Cargo.toml | head -n 1)
          python3 scripts/check_regressions.py --binary target/release/fastmash --expected-version "$version"
          python3 scripts/check_regressions.py --binary target/release/fastmash --expected-version "$version" --stdin-file

  msrv:
    name: Minimum supported Rust version
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88" # rust-version in crates/*/Cargo.toml
      - run: cargo check --workspace --locked

  licenses:
    name: Dependency licenses and advisories
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Each published crate carries the licence texts; keep them identical.
      - name: Licence texts in every crate
        run: |
          for crate in cli conversion numeric-contract portable-numerics sort-process; do
            cmp LICENSE-MIT "crates/$crate/LICENSE-MIT"
            cmp LICENSE-APACHE "crates/$crate/LICENSE-APACHE"
          done
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
