name: CI

# Automatic checks start once the repository is public.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  KACHE_KEY_ENV_VARS: CARGO_MANIFEST_DIR

jobs:
  changes:
    name: Classify changes
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      application: ${{ steps.scope.outputs.application }}
      packages: ${{ steps.scope.outputs.packages }}
      configuration: ${{ steps.scope.outputs.configuration }}
      release_inputs: ${{ steps.paths.outputs.release_inputs }}
      tag: ${{ steps.scope.outputs.tag }}
      homebrew: ${{ steps.paths.outputs.homebrew }}
      locale: ${{ steps.paths.outputs.locale }}
      packages_repository: ${{ steps.paths.outputs.packages_repository }}
      binstall: ${{ steps.paths.outputs.binstall }}
      browser: ${{ steps.paths.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select affected checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          bash .github/scripts/ci-scope.sh "$BASE_SHA" | tee "$GITHUB_OUTPUT"
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        with:
          filters: |
            browser:
              - 'docs/**'
              - 'ARCHITECTURE.md'
              - 'GLOSSARY.md'
              - 'TESTING.md'
              - 'site/**'
              - 'scripts/demo/**'
              - 'scripts/build_site.sh'
              - 'scripts/build_site.py'
              - 'scripts/test_build_site.py'
              - 'scripts/check_public_references.py'
              - 'scripts/test_check_public_references.py'
              - 'scripts/benchmark_chart.py'
              - 'scripts/test_landing_page.mjs'
              - 'scripts/test_docs.mjs'
              - 'package.json'
              - 'package-lock.json'
              - 'wrangler.jsonc'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docs.yml'
            release_inputs:
              - 'release/**'
              - '.github/workflows/macos*.yml'
              - '.github/workflows/windows*.yml'
              - '.github/workflows/linux-release.yml'
              - '.github/workflows/release.yml'
            homebrew:
              - '.github/workflows/homebrew.yml'
              - 'packaging/homebrew/**'
            binstall:
              - '.github/workflows/cargo-binstall.yml'
            locale:
              - '.github/workflows/locale-reference.yml'
              - 'tools/icu-exemplars/**'
              - 'data/locales/collation-candidates.json'
              - 'deny.toml'
            packages_repository:
              - '.github/workflows/package-repository*.yml'
              - 'release/package-repository.sh'
              - 'release/macos-archive.sh'
              - 'packaging/linux-source-test.rs'
              - 'packaging/fedora/**'
              - 'release/publish-package-repository.sh'
              - 'release/package-publication-fixtures.sh'
              - 'release/test-package-publication.sh'
              - 'release/test-package-repository.sh'
              - 'release/check-installed.sh'
              - 'crates/cli/tests/release_installation.rs'
              - 'release/publication-test-server/**'
              - 'packaging/conda-forge/**'

  # Missing filter output runs the checks.
  check:
    name: Format and lint
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.repository.private &&
        (needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != '' || needs.changes.outputs.configuration == 'true')))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check workflow selection
        if: needs.changes.outputs.configuration == 'true'
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/test-ci-scope.sh
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        if: needs.changes.outputs.configuration == 'true' || needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != ''
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: kunobi-ninja/kache-action@061011817fd04b0e460f79d6bb3c115b1fc8f029 # v1
        if: needs.changes.outputs.configuration == 'true' || needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != ''
        with:
          version: v2.1.1
          cache-key-prefix: kache-${{ github.job }}
          cache-executables: true
          pr-comment: false
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        if: needs.changes.outputs.configuration == 'true' || needs.changes.outputs.application != 'false'
        with:
          tool: git-cliff@2.14.2
      - name: Check release tooling
        if: needs.changes.outputs.configuration == 'true' || needs.changes.outputs.application != 'false'
        run: |
          bash -n release/prepare-linux.sh release/build.sh release/train-pgo.sh release/check-crate-packages.sh release/publish-crates.sh release/changelog.sh
          cargo fmt --manifest-path release/publication-test-server/Cargo.toml --check
          cargo clippy --locked --manifest-path release/publication-test-server/Cargo.toml --target-dir target --bin fastmash-pgo-train --test pgo_training --test release_delivery --test ci_workflow -- -D warnings
          cargo test --locked --manifest-path release/publication-test-server/Cargo.toml --target-dir target --test pgo_training --test release_delivery --test ci_workflow
      - run: cargo fmt --all --check
        if: needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != ''
      - name: Lint affected packages
        if: needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != ''
        env:
          APPLICATION: ${{ needs.changes.outputs.application }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          if [ "$APPLICATION" != false ]; then
            cargo clippy --workspace --all-targets --locked -- -D warnings
          else
            for package in $PACKAGES; do
              cargo clippy -p "$package" --all-targets --locked -- -D warnings
            done
          fi

  test:
    name: Test
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.repository.private &&
        (needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != '')))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: kunobi-ninja/kache-action@061011817fd04b0e460f79d6bb3c115b1fc8f029 # v1
        with:
          version: v2.1.1
          cache-key-prefix: kache-${{ github.job }}
          cache-executables: true
          pr-comment: false
      - name: Prepare installed verification tools
        if: needs.changes.outputs.application != 'false' || contains(format(' {0} ', needs.changes.outputs.packages), ' fastmash ')
        run: cargo build --locked --manifest-path release/publication-test-server/Cargo.toml --target-dir target --bins
      - name: Test affected packages
        env:
          APPLICATION: ${{ needs.changes.outputs.application }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          if [ "$APPLICATION" != false ]; then
            cargo test --release --workspace --locked
            cargo build --release --workspace --locked
          else
            for package in $PACKAGES; do
              if [ "$package" = fastmash ]; then
                cargo build --release -p fastmash --locked
              fi
              cargo test --release -p "$package" --locked
            done
          fi
      - name: Test static Linux target
        if: needs.changes.outputs.application != 'false'
        run: |
          cargo test --release --workspace --locked --target x86_64-unknown-linux-musl
          cargo build --release --workspace --locked --target x86_64-unknown-linux-musl
          cargo clippy -p fastmash --all-targets --locked --target x86_64-unknown-linux-musl -- -D warnings
      # Exercise the static delivery target with both corpus transports.
      - name: Regression corpus
        if: needs.changes.outputs.application != 'false'
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          target/release/fastmash-corpus --binary target/x86_64-unknown-linux-musl/release/fastmash --expected-version "$version" --keep-going --evidence-dir "$RUNNER_TEMP/corpus/pipe"
          target/release/fastmash-corpus --binary target/x86_64-unknown-linux-musl/release/fastmash --expected-version "$version" --stdin-file --keep-going --evidence-dir "$RUNNER_TEMP/corpus/file"
      - name: Retain corpus evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-linux
          retention-days: 7
          path: ${{ runner.temp }}/corpus/
          if-no-files-found: ignore

  windows-backend:
    name: Windows unit and driver checks
    timeout-minutes: 30
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.repository.private &&
        (needs.changes.outputs.application != 'false' || needs.changes.outputs.configuration == 'true' ||
         contains(format(' {0} ', needs.changes.outputs.packages), ' fastmash-corpus-driver '))))
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - uses: kunobi-ninja/kache-action@061011817fd04b0e460f79d6bb3c115b1fc8f029 # v1
        with:
          version: v2.1.1
          cache-key-prefix: kache-${{ github.job }}
          cache-executables: true
          pr-comment: false
      - run: cargo clippy -p fastmash --bin fastmash --test windows_backend --test windows_console -p fastmash-corpus-driver --bins --test windows_driver --test windows_powershell --locked -- -D warnings
      - run: cargo build --release -p fastmash-corpus-driver --bins --locked
      - run: cargo test --release -p fastmash --bin fastmash --locked
      - run: cargo test --release -p fastmash-corpus-driver --lib --test windows_driver --locked

  windows-archive:
    needs: [changes, windows-backend]
    if: >-
      !cancelled() && needs.windows-backend.result == 'success'
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: read
      attestations: read
    with:
      release-archive: true

  profiling:
    name: Static profiling on ${{ matrix.os }}
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.repository.private && needs.changes.outputs.application != 'false'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - uses: kunobi-ninja/kache-action@061011817fd04b0e460f79d6bb3c115b1fc8f029 # v1
        with:
          version: v2.1.1
          cache-key-prefix: kache-${{ github.job }}
          cache-executables: true
          pr-comment: false
      - run: cargo clippy -p fastmash --all-targets --features hotpath-alloc --locked -- -D warnings
      - run: cargo test --profile profiling -p fastmash --features hotpath-alloc --test profiling --locked
      - run: cargo build --profile profiling -p fastmash --features hotpath-alloc --bin fastmash --example profile-jobs --locked
      - name: Capture static Representative jobs
        shell: bash
        run: target/profiling/examples/profile-jobs "$RUNNER_TEMP/fastmash-profiling"
      - run: cargo check -p fastmash --all-targets --all-features --locked
      - name: Prepare CPU sampling on the disposable Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/samply.tar.xz" https://github.com/mstange/samply/releases/download/samply-v0.13.1/samply-x86_64-unknown-linux-gnu.tar.xz
          printf '61875daad67888798690dea3cb2748279df6ac299c5c6a857d67eed7642473d9  %s\n' "$RUNNER_TEMP/samply.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/samply.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/samply-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
          cargo install hotpath --version 0.33.0 --bin hotpath-samply --no-default-features --locked
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.yama.ptrace_scope=0 kernel.kptr_restrict=0
      - name: Capture attributed CPU samples
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --profile profiling -p fastmash --features hotpath-cpu --bin fastmash --example profile-jobs --locked
          setsid -w target/profiling/examples/profile-jobs "$RUNNER_TEMP/fastmash-cpu" decimal
          jq -e '.functions_cpu.attributed_samples > 0' "$RUNNER_TEMP/fastmash-cpu/decimal.json"
      - name: Capture instruction counts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends valgrind
          cargo build --profile profiling -p fastmash --features hotpath-callgrind --bin fastmash --locked
          capture="$RUNNER_TEMP/fastmash-callgrind"
          mkdir "$capture"
          printf '1\n2\n3\n' > "$capture/input"
          HOTPATH_METRICS_SERVER_OFF=1 HOTPATH_OUTPUT_PATH="$capture/report.json" \
            HOTPATH_CALLGRIND_OUT_FILE="$capture/callgrind.%p" \
            valgrind --tool=callgrind --callgrind-out-file="$capture/callgrind.%p" \
            target/profiling/fastmash sum 1 < "$capture/input" > "$capture/stdout"
          printf '6\n' | cmp - "$capture/stdout"
          jq -e '.functions_icount.tool | startswith("callgrind-")' "$capture/report.json"
          jq -e '.functions_icount.data | any(.total | tonumber > 0)' "$capture/report.json"
          jq -e '.functions_timing == null' "$capture/report.json"
      - name: Retain diagnostic reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profiling-${{ matrix.os }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/fastmash-profiling/*.json
            ${{ runner.temp }}/fastmash-profiling/*.command
            ${{ runner.temp }}/fastmash-profiling/*.status
            ${{ runner.temp }}/fastmash-profiling/identity.txt
            ${{ runner.temp }}/fastmash-cpu/*.json
            ${{ runner.temp }}/fastmash-cpu/*.command
            ${{ runner.temp }}/fastmash-cpu/*.status
            ${{ runner.temp }}/fastmash-callgrind/
            ${{ runner.temp }}/fastmash-cpu/identity.txt
            /tmp/hotpath/**/hp.json.gz

  licenses:
    name: Dependency licenses and advisories
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.repository.private &&
        (needs.changes.outputs.application != 'false' || needs.changes.outputs.packages != '')))
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Licence texts in the product package
        run: |
          cmp LICENSE-MIT crates/cli/LICENSE-MIT
          cmp LICENSE-APACHE crates/cli/LICENSE-APACHE
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2

  native:
    name: Native macOS
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.repository.private &&
       (needs.changes.outputs.application != 'false' ||
        (needs.changes.outputs.configuration == 'true' && needs.changes.outputs.release_inputs != 'false')))
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: read
      attestations: read

  release-linux:
    name: Linux release artifacts
    needs: changes
    if: >-
      !github.event.repository.private &&
      needs.changes.outputs.configuration == 'true' &&
      needs.changes.outputs.release_inputs != 'false'
    uses: ./.github/workflows/linux-release.yml
    with:
      tag: ${{ needs.changes.outputs.tag }}

  documentation:
    needs: changes
    uses: ./.github/workflows/docs.yml
    with:
      browser: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.browser != 'false' }}

  homebrew:
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.homebrew != 'false')
    uses: ./.github/workflows/homebrew.yml

  locale:
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.locale != 'false')
    uses: ./.github/workflows/locale-reference.yml

  packages-repository:
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.packages_repository != 'false')
    uses: ./.github/workflows/package-repository-checks.yml

  binstall:
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.binstall != 'false')
    uses: ./.github/workflows/cargo-binstall.yml
    with:
      version: ''
    permissions:
      contents: read
      attestations: read

  ci:
    name: CI
    needs: [changes, check, test, windows-backend, windows-archive, profiling, licenses, native, release-linux, documentation, homebrew, locale, packages-repository, binstall]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Require passing checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$DOCUMENTATION_RESULT" = success
          test -n "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A check finished with: $result"; exit 1 ;;
            esac
          done
