name: CI

# Actions minutes are limited: start checks explicitly with gh workflow run CI.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          # Pinned like the release builder, so a new Rust release's lints do
          # not fail unrelated pull requests; raise it deliberately.
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      # The supervisor must sit beside the binary (built by the workspace build).
      - run: python3 scripts/check_regressions.py --binary target/release/fastmash
      - run: python3 scripts/check_regressions.py --binary target/release/fastmash --stdin-file

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.88" # rust-version in crates/*/Cargo.toml
      - run: cargo check --workspace --locked

  licenses:
    name: Dependency licenses and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Each published crate carries the licence texts; keep them identical.
      - name: Licence texts in every crate
        run: |
          for crate in cli conversion numeric-contract portable-numerics sort-process; do
            cmp LICENSE-MIT "crates/$crate/LICENSE-MIT"
            cmp LICENSE-APACHE "crates/$crate/LICENSE-APACHE"
          done
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
