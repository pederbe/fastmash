name: Native safe stream launcher

on:
  push:
    branches: [contrib/safe-native-stream-launcher, contrib/safe-text-test-streams, contrib/safe-quantile-test-streams, contrib/safe-grouping-test-streams, contrib/safe-summary-test-streams, contrib/safe-report-test-streams, contrib/safe-weighted-test-streams, contrib/safe-buffered-input-tests, contrib/safe-record-test-streams, contrib/diagnose-native-create-busy]

permissions:
  contents: read

concurrency:
  group: native-safe-streams-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  MACOSX_DEPLOYMENT_TARGET: '15.0'

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: Safe streams on ${{ matrix.os }} with Rust ${{ matrix.rust }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
        rust: ['1.98.1']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Record native inputs
        run: |
          captures="$RUNNER_TEMP/native-safe-streams"
          printf 'CAPTURES=%s\n' "$captures" >> "$GITHUB_ENV"
          mkdir "$captures"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = "${{ matrix.os == 'macos-15' && '15' || '26' }}"
          { git rev-parse HEAD; git status --porcelain; uname -a; sw_vers; rustc -Vv; cargo -V; } > "$captures/identity.txt"
          shasum -a 256 Cargo.lock crates/cli/Cargo.toml crates/cli/tests/native_streams.rs crates/cli/tests/text_summaries.rs crates/cli/tests/quantiles.rs crates/cli/tests/grouping.rs crates/cli/tests/dispersion.rs crates/cli/tests/extrema.rs crates/cli/tests/sum_mean.rs crates/cli/tests/presentation.rs crates/cli/tests/selectors.rs crates/cli/tests/weighted_mean.rs crates/cli/tests/csv_input.rs crates/cli/tests/record_separators.rs crates/cli/tests/record_separators/*.rs crates/cli/tests/support/process.rs crates/cli/tests/support/test_process.rs crates/cli/tests/support/temp_dir.rs crates/cli/tests/support/full_output.rs crates/cli/tests/support/output_fault.rs crates/cli/tests/support/full_output_interposer.rs crates/cli/tests/support/full_output_probe.rs crates/corpus-driver/Cargo.toml crates/corpus-driver/src/*.rs crates/corpus-driver/tests/test_process.rs crates/corpus-driver/tests/command.rs crates/corpus-driver/tests/support/command.rs > "$captures/inputs.sha256"
      - name: Lint with the maintained compiler
        if: matrix.rust == '1.98.1'
        run: |
          cargo clippy --locked -p fastmash-corpus-driver --bins --test test_process --test command -p fastmash --test native_streams --test text_summaries --test quantiles --test grouping --test dispersion --test extrema --test sum_mean --test presentation --test selectors --test weighted_mean --test csv_input --test record_separators -- -D warnings > "$CAPTURES/clippy.log" 2>&1
      - name: Build candidate and safe launcher
        run: |
          cargo build --release --locked -p fastmash -p fastmash-corpus-driver --bins > "$CAPTURES/build.log" 2>&1
          mkdir "$CAPTURES/bin"
          cp target/release/fastmash target/release/fastmash-sort-supervisor target/release/fastmash-test-process target/release/fastmash-corpus target/release/fastmash-corpus-test-command "$CAPTURES/bin/"
          shasum -a 256 "$CAPTURES/bin/fastmash" "$CAPTURES/bin/fastmash-sort-supervisor" "$CAPTURES/bin/fastmash-test-process" "$CAPTURES/bin/fastmash-corpus" "$CAPTURES/bin/fastmash-corpus-test-command" > "$CAPTURES/binaries.sha256"
      - name: Replay the unchanged record workload
        timeout-minutes: 10
        run: |
          export FASTMASH_TEST_BINARY="$CAPTURES/bin/fastmash"
          export FASTMASH_TEST_CORPUS="$CAPTURES/bin/fastmash-corpus"
          export FASTMASH_TEST_PROCESS="$CAPTURES/bin/fastmash-test-process"
          failure=0
          for attempt in 1 2 3 4 5 6 7 8; do
            status=0
            cargo test --release --locked -p fastmash --test record_separators -- --nocapture > "$CAPTURES/record-attempt-$attempt.log" 2>&1 || status=$?
            printf '%s\n' "$status" > "$CAPTURES/record-attempt-$attempt.status"
            if [ "$status" -ne 0 ]; then failure=1; break; fi
          done
          test "$failure" -eq 0
          shasum -a 256 -c "$CAPTURES/inputs.sha256"
          shasum -a 256 -c "$CAPTURES/binaries.sha256"
      - name: Capture native creation failure context
        if: failure()
        timeout-minutes: 1
        run: |
          /usr/bin/hdiutil info -plist > "$CAPTURES/failure-images.plist" 2> "$CAPTURES/failure-images.stderr" || true
          /sbin/mount > "$CAPTURES/failure-mounts.txt"
          /bin/ps -axo pid,ppid,state,comm > "$CAPTURES/failure-processes.txt"
          /usr/sbin/lsof -nP /dev/disk* > "$CAPTURES/failure-device-holders.txt" 2> "$CAPTURES/failure-device-holders.stderr" || true
          /usr/bin/log show --last 3m --style compact --info --debug --predicate 'process == "hdiutil" OR process == "diskimages-helper" OR process == "diskarbitrationd" OR process == "newfs_hfs" OR process == "fsck_hfs"' > "$CAPTURES/failure-disk-events.log" 2> "$CAPTURES/failure-disk-events.stderr" || true
      - name: Collect failed full-volume receipts
        if: always()
        run: |
          mkdir "$CAPTURES/failed-full-output"
          shopt -s nullglob
          for root in /private/tmp/fastmash-test-*.full-output; do
            test -d "$root" && test ! -L "$root"
            rsync -a --exclude=full.dmg --exclude=mount "$root" "$CAPTURES/failed-full-output/"
          done
      - name: Retain native observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-safe-streams-${{ matrix.os }}-${{ matrix.rust }}
          path: ${{ runner.temp }}/native-safe-streams
          if-no-files-found: error
          retention-days: 7
