name: Homebrew installation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: homebrew-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  recipe:
    name: Install released files on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the installation recipe against the released files
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          fi
          HOMEBREW_UPDATE_TO_TAG=1 brew update
          brew tap-new --no-git fastmash-qualification/local
          tap=$(brew --repository fastmash-qualification/local)
          formula=fastmash-qualification/local/fastmash
          cp packaging/homebrew/fastmash.rb "$tap/Formula/fastmash.rb"
          brew trust --formula "$formula"
          brew style "$formula"
          brew readall --aliases --os=all --arch=all fastmash-qualification/local
          brew audit --except=installed "$formula"
          bash packaging/homebrew/check-install.sh "$formula"
      - name: Remove the installation
        if: always()
        run: |
          prefix=$(brew --prefix)
          cellar=$(brew --cellar fastmash)
          if [[ -d "$cellar" ]]; then brew uninstall --force fastmash; fi
          test ! -e "$prefix/bin/fastmash"
          test ! -e "$prefix/bin/fastmash-sort-supervisor"
          test ! -e "$cellar"
