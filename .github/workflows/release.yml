name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: read
      attestations: read
    with:
      release-archive: true
      check-installation: false

  build:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/linux-release.yml
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}

  draft:
    needs: [build, macos]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-release
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-archive
          path: macos
      - name: Stage the frozen macOS archive
        env:
          EXPECTED_SHA256: ${{ needs.macos.outputs.archive-sha256 }}
        run: |
          test -n "$EXPECTED_SHA256"
          digest=$(sha256sum macos/*.tar.gz)
          test "${digest%% *}" = "$EXPECTED_SHA256"
          (cd macos && sha256sum -c ./*.tar.gz.sha256)
          cp macos/*.tar.gz macos/*.tar.gz.sha256 assets/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/fastmash-*.tar.gz
            assets/fastmash_*.deb
            assets/fastmash-*.rpm
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/release-state.json"; then
            jq -e .isDraft "$RUNNER_TEMP/release-state.json" > /dev/null
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Fastmash ${GITHUB_REF_NAME#v}" --notes-file assets/notes.md --draft
          fi
          existing=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          mkdir "$RUNNER_TEMP/existing-assets"
          for asset in assets/fastmash-*.tar.gz assets/fastmash_*.deb assets/fastmash-*.rpm assets/fastmash-*.sha256 assets/fastmash_*.sha256; do
            name=$(basename "$asset")
            if grep -qxF "$name" <<< "$existing"; then
              gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/existing-assets"
              cmp "$asset" "$RUNNER_TEMP/existing-assets/$name"
            else
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$asset"
            fi
          done

  delivered-macos:
    needs: [draft, macos]
    uses: ./.github/workflows/macos-install.yml
    permissions:
      contents: write
      attestations: read
    with:
      source: release
      tag: ${{ github.ref_name }}
      release-archive: true
      archive-sha256: ${{ needs.macos.outputs.archive-sha256 }}

  publish:
    needs: [draft, delivered-macos, crates-check]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-release
          path: expected
      - name: Verify delivered Linux assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/delivered"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/delivered"
          cd "$RUNNER_TEMP/delivered"
          sha256sum -c ./*.sha256
          # Installation tested these bytes before upload. Compare the downloads
          # with the checksums retained by that build, then verify provenance.
          for checksum in "$GITHUB_WORKSPACE"/expected/*.sha256; do
            sha256sum -c "$checksum"
          done
          for asset in *.tar.gz *.deb *.rpm; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      - name: Publish verified release and start package repository update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$(printf '%s\n' "$latest" "$GITHUB_REF_NAME" | sort -V | tail -1)" = "$GITHUB_REF_NAME" ||
            { echo 'A newer version is already published.' >&2; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          previous_run=$(gh run list --workflow package-repository.yml --branch "$GITHUB_REF_NAME" --json databaseId --limit 1 --jq '.[0].databaseId // 0')
          gh workflow run package-repository.yml --ref "$GITHUB_REF_NAME" -f tag="$GITHUB_REF_NAME"
          run=
          for _ in {1..15}; do
            run=$(gh run list --workflow package-repository.yml --branch "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --json databaseId --limit 1 --jq ".[0].databaseId | select(. > $previous_run)")
            [ -z "$run" ] || break
            sleep 2
          done
          test -n "$run" || { echo 'Package repository dispatch did not produce a run.' >&2; exit 1; }
          gh run watch "$run" --exit-status

  crates-check:
    needs: draft
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
      - name: Check packaged sources before registry authentication
        run: bash release/check-crate-packages.sh "${GITHUB_REF_NAME#v}"

  crates-publish:
    needs: publish
    runs-on: ubuntu-26.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
      - name: Obtain a temporary crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish remaining workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash release/publish-crates.sh "${GITHUB_REF_NAME#v}" publish

  binstall:
    needs: crates-publish
    uses: ./.github/workflows/cargo-binstall.yml
    permissions:
      contents: read
      attestations: read
    with:
      version: ${{ github.ref_name }}

  finish:
    needs: [publish, crates-publish]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Advance the published website source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$latest" = "$GITHUB_REF_NAME" || exit 0
          old=$(git ls-remote --heads origin refs/heads/release | cut -f1)
          git push --force-with-lease="refs/heads/release:$old" origin "$GITHUB_SHA:refs/heads/release"
