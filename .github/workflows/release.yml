name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  macos:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: read
      attestations: read
    with:
      release-archive: true

  build:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag's CHANGELOG section, dated, becomes the release notes.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[$version\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$" CHANGELOG.md ||
            { echo "CHANGELOG.md has no dated entry for $version" >&2; exit 1; }
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on = 1; next}
            on && index($0, "## [") == 1 {exit} on {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      # The release builder (glibc 2.28, pinned Rust) is rebuilt from its
      # digest-pinned base and checksummed toolchain archives.
      - name: Build the release builder
        run: |
          mkdir builder
          cp release/Containerfile builder/
          for component in rustc cargo rust-std; do
            curl --proto '=https' -fsSLo "builder/$component-1.98.1-x86_64-unknown-linux-gnu.tar.xz" \
              "https://static.rust-lang.org/dist/2026-09-03/$component-1.98.1-x86_64-unknown-linux-gnu.tar.xz"
          done
          docker build -f builder/Containerfile -t fastmash-release-builder builder
      # The same recipe that built the benchmarked binaries.
      - name: Build
        run: |
          mkdir out
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/out:/out" \
            -e CARGO_TARGET_DIR=/out/target fastmash-release-builder bash -c \
            'bash /source/release/build.sh && CARGO_HOME=/tmp/cargo python3 /source/scripts/third_party_licenses.py > /out/THIRD-PARTY-LICENSES.md'
      # Refuse to publish bytes that were not the ones measured.
      - name: Check the qualified checksums
        run: |
          cd out/target/release
          sha256sum -c "$GITHUB_WORKSPACE/release/qualified.sha256"
      - name: Test
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/check_regressions.py --binary out/target/release/fastmash --expected-version "$version"
          python3 scripts/check_regressions.py --binary out/target/release/fastmash --expected-version "$version" --stdin-file
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
      - name: Workspace and exact release command checks
        run: |
          FASTMASH_TEST_BINARY="$PWD/out/target/release/fastmash" cargo test --release --workspace --locked
      - name: Package
        run: |
          name="fastmash-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir "$name"
          cp out/target/release/fastmash out/target/release/fastmash-sort-supervisor \
             out/THIRD-PARTY-LICENSES.md README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Test the archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="fastmash-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          installed="$RUNNER_TEMP/archive-installed"
          mkdir "$installed"
          tar -xzf "$name.tar.gz" -C "$installed"
          bash release/check-installed.sh "$version" "$installed/$name" release/qualified.sha256
      # .deb and .rpm of the same bytes; release/package.sh checks that.
      - name: Linux packages
        run: |
          sudo apt-get install -y --no-install-recommends rpm
          version="${GITHUB_REF_NAME#v}"
          name="fastmash-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            bash release/package.sh "$version" out/target/release "$name" packages
          for package in packages/*; do
            cp "$package" .
            sha256sum "$(basename "$package")" > "$(basename "$package").sha256"
          done
      - name: Test the packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker run --rm --network=none -v "$PWD:/w:ro" -e VERSION="$version" debian:12-slim bash -c \
            'set -euo pipefail; dpkg -i /w/fastmash_*_amd64.deb; bash /w/release/check-installed.sh "$VERSION" /usr/bin /w/release/qualified.sha256; dpkg -r fastmash; test ! -e /usr/bin/fastmash; test ! -e /usr/bin/fastmash-sort-supervisor'
          docker run --rm --network=none -v "$PWD:/w:ro" -e VERSION="$version" almalinux:8-minimal bash -c \
            'set -euo pipefail; rpm -i /w/fastmash-*.x86_64.rpm; bash /w/release/check-installed.sh "$VERSION" /usr/bin /w/release/qualified.sha256; rpm -e fastmash; test ! -e /usr/bin/fastmash; test ! -e /usr/bin/fastmash-sort-supervisor'
      - name: Retain qualified Linux assets and notes
        run: |
          mkdir release-assets
          cp fastmash-*.tar.gz fastmash_*.deb fastmash-*.rpm fastmash-*.sha256 fastmash_*.sha256 release-assets/
          cp "$RUNNER_TEMP/notes.md" release-assets/notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: release-assets/
          if-no-files-found: error

  draft:
    needs: [build, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-release
          path: assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-archive
          path: macos
      - name: Stage the frozen macOS archive
        env:
          EXPECTED_SHA256: ${{ needs.macos.outputs.archive-sha256 }}
        run: |
          test -n "$EXPECTED_SHA256"
          digest=$(sha256sum macos/*.tar.gz)
          test "${digest%% *}" = "$EXPECTED_SHA256"
          (cd macos && sha256sum -c ./*.tar.gz.sha256)
          cp macos/*.tar.gz macos/*.tar.gz.sha256 assets/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/fastmash-*.tar.gz
            assets/fastmash_*.deb
            assets/fastmash-*.rpm
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" assets/fastmash-*.tar.gz assets/fastmash_*.deb assets/fastmash-*.rpm \
            assets/fastmash-*.sha256 assets/fastmash_*.sha256 \
            --verify-tag --title "Fastmash ${GITHUB_REF_NAME#v}" --notes-file assets/notes.md --draft

  delivered-macos:
    needs: [draft, macos]
    uses: ./.github/workflows/macos-install.yml
    permissions:
      contents: write
      attestations: read
    with:
      source: release
      tag: ${{ github.ref_name }}
      release-archive: true
      archive-sha256: ${{ needs.macos.outputs.archive-sha256 }}
