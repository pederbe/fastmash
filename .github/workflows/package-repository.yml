name: Package repository

# Adds a published release's .deb and .rpm to the signed apt and dnf
# repository at packages.fastmash.io. It uses the release assets as
# published, after checking their checksums and their attestations from
# release.yml, and never rebuilds the programs. Dispatch it on main with a tag
# for releases whose tagged commit predates this workflow.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, such as v0.2.0
        required: true

permissions:
  contents: read
  attestations: read

# One run at a time. GitHub keeps only the newest pending run in the group, so
# dispatch backfills one after another, each after the previous has finished.
concurrency:
  group: package-repository
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    # The signing key and storage credentials live only in this environment,
    # which requires the maintainer's approval.
    environment: packages
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      BUCKET: fastmash-packages
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Check the release
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          test -f release/package-signing-key.asc ||
            { echo "release/package-signing-key.asc is not committed" >&2; exit 1; }
          # The tags endpoint does not return drafts.
          state=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '"\(.draft) \(.prerelease)"')
          test "$state" = "false false" || { echo "$TAG is not a published full release" >&2; exit 1; }
          git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git show "$TAG:release/qualified.sha256" > "$RUNNER_TEMP/qualified.sha256"
      - name: Download and verify the packages
        run: |
          version=${TAG#v}
          mkdir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          for name in "fastmash_${version}_amd64.deb" "fastmash-${version}-1.x86_64.rpm"; do
            for file in "$name" "$name.sha256"; do
              curl --proto '=https' -fsSLO "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$file"
            done
            sha256sum -c "$name.sha256"
            gh attestation verify "$name" --repo "$GITHUB_REPOSITORY" --source-ref "refs/tags/$TAG" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      - name: Install the repository tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends apt-utils createrepo-c rpm
      - name: Import the signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$PACKAGE_SIGNING_KEY" | gpg --batch --import
      - name: Fetch the published repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          mkdir "$RUNNER_TEMP/repository"
          aws s3 sync --only-show-errors "s3://$BUCKET" "$RUNNER_TEMP/repository"
      # Storage access is weaker than the signing key: every .deb already in
      # the pool must still be the one its release published before it is
      # signed into the metadata again. Published RPMs carry the release key's
      # signature, which package-repository.sh checks.
      - name: Check the published packages
        run: |
          cd "$RUNNER_TEMP/repository"
          test -d apt/pool/main/f/fastmash || exit 0
          for file in apt/pool/main/f/fastmash/*.deb; do
            name=$(basename "$file")
            [[ $name =~ ^fastmash_([0-9]+\.[0-9]+\.[0-9]+)_amd64\.deb$ ]] ||
              { echo "unexpected package $name" >&2; exit 1; }
            expected=$(curl --proto '=https' -fsSL \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/v${BASH_REMATCH[1]}/$name.sha256")
            test "${expected%% *}" = "$(sha256sum < "$file" | cut -d' ' -f1)" ||
              { echo "$name differs from its release" >&2; exit 1; }
          done
      - name: Add the packages and sign the repository
        env:
          GPG_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: |
          version=${TAG#v}
          bash release/package-repository.sh "$RUNNER_TEMP/repository" release/package-signing-key.asc \
            "$RUNNER_TEMP/assets/fastmash_${version}_amd64.deb" \
            "$RUNNER_TEMP/assets/fastmash-${version}-1.x86_64.rpm"
      - name: Install, upgrade and remove from the repository
        run: |
          version=${TAG#v}
          # When this is the newest version, the next one down is upgraded from;
          # an older release added later is installed directly.
          versions=$(find "$RUNNER_TEMP/repository/apt/pool" -name 'fastmash_*_amd64.deb' -printf '%f\n' |
            sed 's/^fastmash_\(.*\)_amd64\.deb$/\1/' | sort -V)
          previous=
          if [ "$(tail -n 1 <<<"$versions")" = "$version" ]; then
            previous=$(grep -vxF "$version" <<<"$versions" | tail -n 1 || true)
          fi
          bash release/test-package-repository.sh "$RUNNER_TEMP/repository" "$version" \
            "$RUNNER_TEMP/qualified.sha256" ${previous:+"$previous"}
      # Packages and hash-named dnf metadata first, then each index in the
      # order clients follow references, signatures last, so a client reading
      # during the upload never finds a file that its index does not match.
      - name: Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          cd "$RUNNER_TEMP/repository"
          aws s3 sync --only-show-errors . "s3://$BUCKET" \
            --exclude 'apt/dists/*' --exclude 'rpm/repodata/repomd.xml*' --exclude 'fastmash.*' \
            --cache-control 'public, max-age=31536000, immutable'
          for path in fastmash.asc fastmash.gpg fastmash.repo \
              apt/dists/stable/main/binary-amd64/Packages apt/dists/stable/main/binary-amd64/Packages.gz \
              apt/dists/stable/Release apt/dists/stable/Release.gpg apt/dists/stable/InRelease \
              rpm/repodata/repomd.xml rpm/repodata/repomd.xml.asc; do
            aws s3 cp --only-show-errors "$path" "s3://$BUCKET/$path" --cache-control 'no-cache'
          done
      - name: Check the published repository
        run: |
          cd "$RUNNER_TEMP/repository"
          for path in apt/dists/stable/InRelease rpm/repodata/repomd.xml rpm/repodata/repomd.xml.asc fastmash.asc; do
            curl --proto '=https' -fsSL "https://packages.fastmash.io/$path" | cmp - "$path"
          done
