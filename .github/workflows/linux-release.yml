name: Linux release artifacts

# Reused by release publication and by CI without publishing anything.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      # The tag's CHANGELOG section, dated, becomes the release notes.
      - name: Release notes
        run: |
          version="${RELEASE_TAG#v}"
          grep -q "^## \[$version\] - [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$" CHANGELOG.md ||
            { echo "CHANGELOG.md has no dated entry for $version" >&2; exit 1; }
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on = 1; next}
            on && index($0, "## [") == 1 {exit} on {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      # Two clean builds establish reproducibility. Package one of those pairs.
      - name: Build reproducible Linux executables
        run: |
          bash release/prepare-linux.sh
          mkdir -p out/target/release
          cp "$RUNNER_TEMP/weekly-linux/out/first/release/fastmash" \
             "$RUNNER_TEMP/weekly-linux/out/first/release/fastmash-sort-supervisor" out/target/release/
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/out:/out" \
            -e CARGO_TARGET_DIR=/out/notices fastmash-weekly-builder bash -c \
            'CARGO_HOME=/tmp/cargo cargo run --locked --release -p fastmash-license-notices --manifest-path /source/Cargo.toml > /out/THIRD-PARTY-LICENSES.md'
      # This run's manifest binds the tested and uploaded bytes.
      - name: Check the frozen delivery checksums
        run: |
          cd out/target/release
          sha256sum -c "$GITHUB_WORKSPACE/release/delivery.sha256"
      - name: Test
        run: |
          cargo build --release --locked -p fastmash-corpus-driver --bin fastmash-corpus
          version="${RELEASE_TAG#v}"
          target/release/fastmash-corpus --binary out/target/release/fastmash --expected-version "$version"
          target/release/fastmash-corpus --binary out/target/release/fastmash --expected-version "$version" --stdin-file
          (cd out/target/release && sha256sum -c "$GITHUB_WORKSPACE/release/delivery.sha256")
      - name: Workspace and exact release command checks
        run: |
          cargo build --locked --manifest-path release/publication-test-server/Cargo.toml --target-dir target --bins
          FASTMASH_TEST_BINARY="$PWD/out/target/release/fastmash" cargo test --release --workspace --locked
      - name: Package
        run: |
          name="fastmash-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          mkdir "$name"
          cp out/target/release/fastmash out/target/release/fastmash-sort-supervisor \
             out/THIRD-PARTY-LICENSES.md README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          cp release/delivery.sha256 "$name/binary.sha256"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Test the archive
        run: |
          version="${RELEASE_TAG#v}"
          name="fastmash-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          installed="$RUNNER_TEMP/archive-installed"
          mkdir "$installed"
          tar -xzf "$name.tar.gz" -C "$installed"
          bash release/check-installed.sh "$version" "$installed/$name" release/delivery.sha256
      # .deb and .rpm of the same bytes; release/package.sh checks that.
      - name: Linux packages
        run: |
          sudo apt-get install -y --no-install-recommends rpm
          version="${RELEASE_TAG#v}"
          name="fastmash-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            bash release/package.sh "$version" out/target/release "$name" packages
          for package in packages/*; do
            cp "$package" .
            sha256sum "$(basename "$package")" > "$(basename "$package").sha256"
          done
      - name: Test the packages
        run: |
          version="${RELEASE_TAG#v}"
          name="fastmash-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          target/debug/fastmash-test-package-installation packages packages "$version" release/delivery.sha256 \
            --expected-docs "$name"
      - name: Retain tested Linux assets and notes
        run: |
          mkdir release-assets
          cp fastmash-*.tar.gz fastmash_*.deb fastmash-*.rpm fastmash-*.sha256 fastmash_*.sha256 release-assets/
          cp "$RUNNER_TEMP/notes.md" release-assets/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: release-assets/
          if-no-files-found: error

