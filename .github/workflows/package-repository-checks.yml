name: Package repository checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/package-repository*.yml'
      - 'release/package-repository.sh'
      - 'release/macos-archive.sh'
      - 'packaging/linux-source-test.rs'
      - 'packaging/fedora/**'
      - 'packaging/nix/**'
      - 'release/publish-package-repository.sh'
      - 'release/package-publication-fixtures.sh'
      - 'release/test-package-publication.sh'
      - 'release/test-package-repository.sh'
      - 'release/check-installed.sh'
      - 'crates/cli/tests/release_installation.rs'
      - 'release/publication-test-server/**'
      - 'packaging/conda-forge/**'
      - 'packaging/homebrew/**'

permissions:
  contents: read

concurrency:
  group: package-repository-checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  publication:
    name: Package publication consistency
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Install repository tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends apt-utils createrepo-c rpm gnupg2 file shellcheck
      - name: Check tooling
        run: |
          shellcheck release/package-repository.sh release/publish-package-repository.sh \
            release/package-publication-fixtures.sh release/test-package-publication.sh release/test-package-repository.sh release/check-installed.sh \
            packaging/conda-forge/build.sh packaging/conda-forge/run_test.sh release/macos-archive.sh \
            packaging/fedora/prepare-sources.sh
          cargo fmt --manifest-path release/publication-test-server/Cargo.toml --check
          cargo clippy --manifest-path release/publication-test-server/Cargo.toml --target-dir target --all-targets --locked -- -D warnings
          cargo test --manifest-path release/publication-test-server/Cargo.toml --target-dir target --locked
      - name: Check interrupted and interleaved publication
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          bash release/package-publication-fixtures.sh "$work"
          bash release/test-package-publication.sh "$work/old" "$work/new"
          # The host RPM 6 verifier also accepts V6-only signatures. Require the
          # oldest supported RPM client to recognize the fixture signatures.
          docker run --rm -v "$work/new:/repo:ro" almalinux:8 /bin/bash -ec '
            rpmkeys --import /repo/fastmash.asc
            for package in /repo/rpm/*.rpm; do
              rpmkeys --checksig "$package" | grep -q ": digests signatures OK$"
            done
          '
