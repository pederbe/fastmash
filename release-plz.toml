[workspace]
# Keep Cargo uploads in release.yml, after artifact qualification.
publish = false
git_tag_enable = false
git_release_enable = false
changelog_update = false
release_always = false
features_always_increment_minor = true
pr_name = "chore: release{% if version %} v{{ version }}{% endif %}"
release_commits = '^(feat|fix|perf|docs|revert)(\([^)]*\))?!?:|^[a-z]+(\([^)]*\))?!:|^[A-Z]|(?m:^BREAKING[ -]CHANGE:)'

[[package]]
name = "fastmash-numeric-contract"
version_group = "fastmash"

[[package]]
name = "fastmash-conversion"
version_group = "fastmash"

[[package]]
name = "fastmash-portable-numerics"
version_group = "fastmash"

[[package]]
name = "fastmash-sort-process"
version_group = "fastmash"

[[package]]
name = "fastmash"
version_group = "fastmash"
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["fastmash-numeric-contract", "fastmash-conversion", "fastmash-portable-numerics", "fastmash-sort-process"]
git_tag_name = "v{{ version }}"
git_tag_enable = true
git_release_enable = true
git_release_draft = true
git_release_name = "Fastmash {{ version }}"

[[package]]
name = "fastmash-corpus-driver"
release = false

[[package]]
name = "fastmash-license-notices"
release = false

[[package]]
name = "fastmash-locale-tools"
release = false

[changelog]
header = """# Changelog

## [Unreleased]
"""
body = """

## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits | unique(attribute="message") %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %}

{{ commit.breaking_description | trim }}

{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true
sort_commits = "oldest"
protect_breaking_commits = true
commit_preprocessors = [
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/pederbe/fastmash/pull/${1}))" },
]
commit_parsers = [
  { message = "^feat\\(remove\\)!?:", group = "<!-- 0 -->Removed" },
  { message = "^feat\\(deprecate\\)!?:", group = "<!-- 1 -->Deprecated" },
  { message = "^[a-z]+(\\([^)]*\\))?!:", group = "<!-- 0 -->Changed" },
  { footer = "^BREAKING[ -]CHANGE:", group = "<!-- 0 -->Changed" },
  { message = "^feat(\\([^)]*\\))?:", group = "<!-- 1 -->Added" },
  { message = "^fix\\(deps\\):", group = "<!-- 4 -->Dependencies" },
  { message = "^fix\\(security\\):", group = "<!-- 2 -->Security" },
  { message = "^fix(\\([^)]*\\))?:", group = "<!-- 2 -->Fixed" },
  { message = "^perf(\\([^)]*\\))?:", group = "<!-- 3 -->Performance" },
  { message = "^docs(\\([^)]*\\))?:", group = "<!-- 5 -->Documentation" },
  { message = "^(chore|ci|build|test|style|refactor)(\\([^)]*\\))?:", skip = true },
  { message = ".*", group = "<!-- 6 -->Other changes" },
]

[[changelog.postprocessors]]
pattern = '(?m)^- Make guides and decision records easier to use (\(\[#218\]\(https://github\.com/pederbe/fastmash/pull/218\)\))$'
replace = '- Reorganized documentation navigation, shortened architecture decision records and updated guides and examples. ${1}'

[[changelog.postprocessors]]
pattern = '(?m)^- Clarify CLI help and current command support (\(\[#219\]\(https://github\.com/pederbe/fastmash/pull/219\)\))$'
replace = '- Made CLI help shorter and easier to scan, with clearer examples and accurate descriptions of supported formats and limits. ${1}'

[[changelog.postprocessors]]
pattern = '(?m)^- Clarify CLI diagnostics and recovery hints (\(\[#220\]\(https://github\.com/pederbe/fastmash/pull/220\)\))$'
replace = """- Clarified error messages and recovery advice for field selection, result names, CSV support, sorting and NaN ranking values. ${1}

Calculations and exit statuses are unchanged. Scripts that match the changed error text may need updating."""
