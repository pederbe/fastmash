<rect class="fm-bar-0" x="250" y="130" width="127.3" height="11" rx="2"><title>Exon statistics per gene (RefGene), Intel laptop, native Linux: GNU 157.8 ms, Fastmash 86.8 ms</title></rect>
<text class="fm-value" x="381.3" y="139">1.8×</text>
<rect class="fm-bar-1" x="250" y="144" width="116.4" height="11" rx="2"><title>Exon statistics per gene (RefGene), AMD desktop, native Linux: GNU 74.8 ms, Fastmash 45.0 ms</title></rect>
<text class="fm-value" x="370.4" y="153">1.7×</text>
<text class="fm-text" x="240" y="188.5" text-anchor="end">Many small groups (genes)</text>
<rect class="fm-bar-0" x="250" y="172" width="88.0" height="11" rx="2"><title>Many small groups (genes), Intel laptop, native Linux: GNU 159.8 ms, Fastmash 127.1 ms</title></rect>
<text class="fm-value" x="342.0" y="181">1.3×</text>
<rect class="fm-bar-1" x="250" y="186" width="87.1" height="11" rx="2"><title>Many small groups (genes), AMD desktop, native Linux: GNU 66.1 ms, Fastmash 53.1 ms</title></rect>
<text class="fm-value" x="341.1" y="195">1.2×</text>
