<svg class="fm-chart" viewBox="0 0 730 574" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="fm-chart-title">
<title id="fm-chart-title">How many times faster Fastmash is than GNU datamash on the core jobs, per host</title>
