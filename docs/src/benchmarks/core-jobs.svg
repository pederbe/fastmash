<text class="fm-value" x="345.7" y="489">1.1×</text>
<text class="fm-muted" x="250" y="534">Times faster than GNU datamash 1.9, by median elapsed time.</text>
<text class="fm-muted" x="250" y="548">The dashed line is the same speed; shorter bars are slower.</text>
<text class="fm-muted" x="250" y="564">Fastmash 0.1.0 release build da311d13, measured 2026-09-27 against GNU datamash 1.9</text>
