<rect class="fm-bar-0" x="250" y="340" width="123.2" height="11" rx="2"><title>Grouped decimals, 100k rows, Intel laptop, native Linux: GNU 68.1 ms, Fastmash 38.7 ms</title></rect>
<text class="fm-value" x="377.2" y="349">1.8×</text>
<rect class="fm-bar-1" x="250" y="354" width="106.9" height="11" rx="2"><title>Grouped decimals, 100k rows, AMD desktop, native Linux: GNU 27.5 ms, Fastmash 18.0 ms</title></rect>
<text class="fm-value" x="360.9" y="363">1.5×</text>
<text class="fm-text" x="240" y="398.5" text-anchor="end">One dominant group</text>
<rect class="fm-bar-0" x="250" y="382" width="166.2" height="11" rx="2"><title>One dominant group, Intel laptop, native Linux: GNU 21.6 ms, Fastmash 9.1 ms</title></rect>
<text class="fm-value" x="420.2" y="391">2.4×</text>
<rect class="fm-bar-1" x="250" y="396" width="166.9" height="11" rx="2"><title>One dominant group, AMD desktop, native Linux: GNU 9.3 ms, Fastmash 3.9 ms</title></rect>
<text class="fm-value" x="420.9" y="405">2.4×</text>
<text class="fm-text" x="240" y="440.5" text-anchor="end">Wine quality by grade</text>
<rect class="fm-bar-0" x="250" y="424" width="161.5" height="11" rx="2"><title>Wine quality by grade, Intel laptop, native Linux: GNU 6.0 ms, Fastmash 2.6 ms</title></rect>
<text class="fm-value" x="415.5" y="433">2.3×</text>
<rect class="fm-bar-1" x="250" y="438" width="175.0" height="11" rx="2"><title>Wine quality by grade, AMD desktop, native Linux: GNU 3.0 ms, Fastmash 1.2 ms</title></rect>
<text class="fm-value" x="429.0" y="447">2.5×</text>
<text class="fm-text" x="240" y="482.5" text-anchor="end">Large sorted summary</text>
<rect class="fm-bar-0" x="250" y="466" width="77.4" height="11" rx="2"><title>Large sorted summary, Intel laptop, native Linux: GNU 547.2 ms, Fastmash 495.1 ms</title></rect>
<text class="fm-value" x="331.4" y="475">1.1×</text>
<rect class="fm-bar-1" x="250" y="480" width="59.6" height="11" rx="2"><title>Large sorted summary, AMD desktop, native Linux: GNU 204.4 ms, Fastmash 240.2 ms</title></rect>
<text class="fm-value" x="313.6" y="489">0.9×</text>
<text class="fm-muted" x="250" y="534">Times faster than GNU datamash 1.9, by median elapsed time.</text>
<text class="fm-muted" x="250" y="548">The dashed line is the same speed; shorter bars are slower.</text>
</svg>
