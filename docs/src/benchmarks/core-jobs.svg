<rect class="fm-bar-0" x="250" y="256" width="260.3" height="11" rx="2"><title>Sum and mean, 1M decimals, Intel laptop, native Linux: GNU 325.4 ms, Fastmash 87.5 ms</title></rect>
<text class="fm-value" x="514.3" y="265">3.7×</text>
<rect class="fm-bar-1" x="250" y="270" width="216.0" height="11" rx="2"><title>Sum and mean, 1M decimals, AMD desktop, native Linux: GNU 114.8 ms, Fastmash 37.2 ms</title></rect>
<text class="fm-value" x="470.0" y="279">3.1×</text>
<text class="fm-text" x="240" y="314.5" text-anchor="end">Sum and mean, 100k decimals</text>
<rect class="fm-bar-0" x="250" y="298" width="241.7" height="11" rx="2"><title>Sum and mean, 100k decimals, Intel laptop, native Linux: GNU 32.8 ms, Fastmash 9.5 ms</title></rect>
<text class="fm-value" x="495.7" y="307">3.5×</text>
<rect class="fm-bar-1" x="250" y="312" width="208.2" height="11" rx="2"><title>Sum and mean, 100k decimals, AMD desktop, native Linux: GNU 11.6 ms, Fastmash 3.9 ms</title></rect>
<text class="fm-value" x="462.2" y="321">3.0×</text>
