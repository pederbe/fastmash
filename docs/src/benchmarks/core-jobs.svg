<text class="fm-muted" x="250.0" y="516" text-anchor="middle">0×</text>
<line class="fm-parity" x1="334.0" y1="38" x2="334.0" y2="498"/>
<text class="fm-muted" x="334.0" y="516" text-anchor="middle">1×</text>
