<svg class="fm-chart" viewBox="0 0 730 574" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="fm-chart-title">
<title id="fm-chart-title">How many times faster Fastmash is than GNU datamash on the core jobs, per host</title>
<rect class="fm-bar-0" x="250" y="8" width="12" height="12" rx="2"/>
<text class="fm-text" x="268" y="18">Intel laptop, native Linux</text>
<rect class="fm-bar-1" x="460" y="8" width="12" height="12" rx="2"/>
<text class="fm-text" x="478" y="18">AMD desktop, native Linux</text>
<line class="fm-grid" x1="250.0" y1="38" x2="250.0" y2="498"/>
<text class="fm-muted" x="250.0" y="516" text-anchor="middle">0×</text>
<line class="fm-parity" x1="320.0" y1="38" x2="320.0" y2="498"/>
<text class="fm-muted" x="320.0" y="516" text-anchor="middle">1×</text>
<line class="fm-grid" x1="390.0" y1="38" x2="390.0" y2="498"/>
<text class="fm-muted" x="390.0" y="516" text-anchor="middle">2×</text>
<line class="fm-grid" x1="460.0" y1="38" x2="460.0" y2="498"/>
<text class="fm-muted" x="460.0" y="516" text-anchor="middle">3×</text>
<line class="fm-grid" x1="530.0" y1="38" x2="530.0" y2="498"/>
<text class="fm-muted" x="530.0" y="516" text-anchor="middle">4×</text>
<line class="fm-grid" x1="600.0" y1="38" x2="600.0" y2="498"/>
<text class="fm-muted" x="600.0" y="516" text-anchor="middle">5×</text>
<line class="fm-grid" x1="670.0" y1="38" x2="670.0" y2="498"/>
<text class="fm-muted" x="670.0" y="516" text-anchor="middle">6×</text>
<text class="fm-text" x="240" y="62.5" text-anchor="end">Exon-count quantiles (RefGene)</text>
<rect class="fm-bar-0" x="250" y="46" width="361.4" height="11" rx="2"><title>Exon-count quantiles (RefGene), Intel laptop, native Linux: GNU 111.0 ms, Fastmash 21.5 ms</title></rect>
<text class="fm-value" x="615.4" y="55">5.2×</text>
<rect class="fm-bar-1" x="250" y="60" width="333.3" height="11" rx="2"><title>Exon-count quantiles (RefGene), AMD desktop, native Linux: GNU 60.0 ms, Fastmash 12.6 ms</title></rect>
<text class="fm-value" x="587.3" y="69">4.8×</text>
