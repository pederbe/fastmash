<rect class="fm-bar-0" x="250" y="88" width="106.2" height="11" rx="2"><title>Transcripts per gene (RefGene), Intel laptop, native Linux: GNU 110.8 ms, Fastmash 73.0 ms</title></rect>
<text class="fm-value" x="360.2" y="97">1.5×</text>
<rect class="fm-bar-1" x="250" y="102" width="105.3" height="11" rx="2"><title>Transcripts per gene (RefGene), AMD desktop, native Linux: GNU 57.0 ms, Fastmash 37.9 ms</title></rect>
<text class="fm-value" x="359.3" y="111">1.5×</text>
