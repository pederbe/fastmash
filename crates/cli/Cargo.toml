[package]
name = "fastmash"
version = "0.2.0"
edition = "2024"
description = "Fast command-line statistics on text data, compatible with GNU datamash"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pederbe/fastmash"
homepage = "https://fastmash.io"
rust-version = "1.88"
keywords = ["statistics", "datamash", "tsv", "csv", "cli"]
categories = ["command-line-utilities", "science", "text-processing"]
readme = "../../README.md"

# `cargo binstall fastmash` downloads the prebuilt release archive (the
# tested delivery binaries) instead of compiling. The cargo-binstall workflow
# checks this route for each release. QuickInstall is disabled so a failed
# download never installs a third-party build.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/fastmash-v{ version }-{ target }.tar.gz"
bin-dir = "fastmash-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[[bin]]
name = "fastmash"
path = "src/main.rs"

[[bin]]
name = "fastmash-sort-supervisor"
path = "src/bin/fastmash-sort-supervisor.rs"

[dependencies]
# Optional diagnostics only. Ordinary builds do not compile or link hotpath.
hotpath = { version = "0.29.2", optional = true, default-features = false }
fastmash-numeric-contract = { path = "../numeric-contract", version = "=0.2.0" }
fastmash-conversion = { path = "../conversion", version = "=0.2.0" }
fastmash-portable-numerics = { path = "../portable-numerics", version = "=0.2.0" }
fastmash-sort-process = { path = "../sort-process", version = "=0.2.0" }
rustc_apfloat = "0.2.3"
libc = "0.2.191"
# Safe descriptor observations, closure, resource-limit and signal-mask queries.
nix = { version = "0.31.3", default-features = false, features = ["fs", "resource", "signal"] }
memchr = "2.8.3"
# "unstable" only re-exports CollationKeySink, for sort keys that refuse
# instead of aborting when they cannot grow.
icu_collator = { version = "2.4.0", features = ["unstable"] }
icu_locale_core = "2.4.0"
astro-float-num = { version = "0.3.7", default-features = false, features = ["std"] }
base64 = { version = "0.23.1", default-features = false }
md-5 = { version = "0.11.0", default-features = false }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
mem_prefetch = { version = "0.1.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "rand", "stdio", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Borrow standard descriptors without initializing an additional I/O buffer.
rustix = { version = "1.1.6", default-features = false, features = ["std", "stdio", "fs", "termios"] }
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }

[features]
default = []
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
hotpath-callgrind = ["hotpath", "hotpath/hotpath-callgrind"]

[dev-dependencies]
# Independent byte-reader check for canonical CSV output, not the input parser.
csv-core = "0.1.13"
# Safe descriptor file actions, access checks and bounded child reaping in tests.
# Owned pseudo-terminals and raw mode setup use the term feature.
nix = { version = "0.31.3", default-features = false, features = ["fs", "signal", "term", "poll"] }
# Exact arithmetic for the generated decimal power table and its tests.
num-bigint = { version = "0.5.1", default-features = false }

# Reuse owned full-output and terminal-input transports in integration tests.
fastmash-corpus-driver = { path = "../corpus-driver" }

# Same as the workspace release profile, for crates.io installs (cargo
# ignores workspace profiles there). Workspace builds warn that this copy is
# ignored; keep the two in step.
[profile.release]
opt-level = 2
panic = "abort"
overflow-checks = true
lto = false
# Typical jobs run a median 2% faster (up to 6%) with one codegen unit;
# clean builds take about 45% longer.
codegen-units = 1
