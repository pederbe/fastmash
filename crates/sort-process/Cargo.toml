[package]
name = "fastmash-sort-process"
version = "0.2.0"
edition = "2024"
description = "Native spill storage and thread policy for fastmash"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pederbe/fastmash"
homepage = "https://fastmash.io"
rust-version = "1.88"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "rand"] }

[target.'cfg(target_os = "macos")'.dependencies]
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
