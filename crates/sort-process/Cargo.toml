[package]
name = "fastmash-sort-process"
version = "0.2.0"
edition = "2024"
description = "Supervised external sort process for fastmash"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pederbe/fastmash"
homepage = "https://fastmash.io"
rust-version = "1.88"

[target.'cfg(target_os = "macos")'.dependencies]
# The CLI already pins libc; typed native entropy avoids another FFI contract.
libc = "=0.2.189"
