[package]
name = "fastmash-locale-tools"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false
description = "Development generation and comparison of Fastmash locale tables"

[[bin]]
name = "locale-tools-fixture"
path = "tests/support/executor-fixture.rs"
test = false
bench = false

[[bin]]
name = "collation-words-fixture"
path = "tests/support/collation-words-fixture.rs"
test = false
bench = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
# Compile emitted tables against the real safe Profile constructor and getters.
fastmash-conversion = { path = "../conversion", version = "=0.2.0" }

[lints]
workspace = true
