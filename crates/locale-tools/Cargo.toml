[package]
name = "fastmash-locale-tools"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false
description = "Development generation and comparison of Fastmash locale tables"

[[bin]]
name = "locale-tools-fixture"
path = "tests/support/executor-fixture.rs"
test = false
bench = false

[[bin]]
name = "collation-words-fixture"
path = "tests/support/collation-words-fixture.rs"
test = false
bench = false

[[bin]]
name = "locale-capture-fixture"
path = "tests/support/capture-fixture.rs"
test = false
bench = false

[[bin]]
name = "collation-punctuation-fixture"
path = "tests/support/punctuation-fixture.rs"
test = false
bench = false

[[bin]]
name = "collation-candidate-sort-fixture"
path = "tests/support/candidate-sort-fixture.rs"
test = false
bench = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Hash the independent common source with the already pinned workspace implementation.
sha2 = { version = "=0.11.0", default-features = false }
# Match the retained planner's Unicode 15.0.0 scalar expansions and properties,
# independently of compiler tables. Pin data too: the code crate allows patches.
unicode-case-mapping = "=0.5.0"
# Check normalization against the retained glibc generator's Unicode 16 data.
unicode-normalization = "=0.1.26"
# Keep the generator's character selection on Unicode 16.
unicode-general-category = "=1.0.0"
unicode_names2 = "=2.0.0"
icu_properties_15 = { package = "icu_properties", version = "=1.3.2", default-features = false, features = ["compiled_data"] }
icu_properties_data_15 = { package = "icu_properties_data", version = "=1.3.2" }

[target.'cfg(unix)'.dependencies]
# Reuse the pinned safe pipe-flag and group-signal interfaces used by the
# corpus driver, without importing its command policies or first-party FFI.
nix = { version = "=0.31.3", default-features = false, features = ["fs", "signal"] }

[dev-dependencies]
# Compile emitted tables against the real safe Profile constructor and getters.
fastmash-conversion = { path = "../conversion", version = "=0.2.0" }

[lints]
workspace = true
