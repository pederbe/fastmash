# cargo-deny policy for the published crates (https://embarkstudios.github.io/cargo-deny/).

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[licenses]
version = 2
# Every license in the dependency graph as of 0.1.0; review additions.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # rustc_apfloat
    "Unicode-3.0",                    # ICU4X collation data
    "Unlicense",                      # memchr (dual-licensed with MIT)
    "Zlib",                           # zlib-rs decodes optional CPU captures
]
confidence-threshold = 0.93

# Native ICU development bindings use these build-time tools. Scope their
# reviewed permissive licenses by package so compatible updates remain eligible.
[[licenses.exceptions]]
name = "bindgen"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "libloading"
allow = ["ISC"]

# The development-only Unicode name lookup retains its data-file license.
[[licenses.exceptions]]
name = "unicode_names2"
allow = ["Unicode-DFS-2016"]

[advisories]
version = 2
# Vulnerabilities fail the check; unmaintained crates are reported for review
# rather than failing unrelated changes.
unmaintained = "workspace"
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
